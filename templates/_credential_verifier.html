<div class="credential-verifier" id="credentialVerifier" hidden>
  <div class="credential-verifier-heading">
    <div><strong>签到凭证二次核验</strong><small>手机摄像头扫码或使用电脑外接扫码器</small></div>
    <button type="button" class="dialog-close" id="closeCredentialVerifier" aria-label="关闭">×</button>
  </div>
  <div class="credential-verifier-controls">
    <form id="credentialVerifyForm" class="credential-scanner-form">
      <label class="form-label" for="credentialScanInput">扫码器输入</label>
      <div class="input-group">
        <input class="form-control" id="credentialScanInput" autocomplete="off" inputmode="url" placeholder="点击此处后使用扫码器，或粘贴凭证内容">
        <button class="btn btn-success" type="submit">立即核验</button>
      </div>
      <small class="form-text">常见外接扫码器扫描后会自动输入并提交；也可手工粘贴二维码内容。</small>
    </form>
    <div class="credential-camera-actions">
      <button class="btn btn-outline-success" type="button" id="startCredentialCamera">▣ 手机摄像头扫码</button>
      <button class="btn btn-outline-secondary" type="button" id="stopCredentialCamera" hidden>停止扫码</button>
      <small>摄像头需要 HTTPS 页面和浏览器授权。</small>
    </div>
  </div>
  <div class="credential-camera" id="credentialCamera" hidden></div>
  <div class="credential-verify-result" id="credentialVerifyResult" role="status" hidden>
    <div class="credential-result-icon" id="credentialResultIcon"></div>
    <div class="credential-result-main">
      <strong id="credentialResultTitle"></strong>
      <p id="credentialResultMessage"></p>
      <dl id="credentialResultDetails" hidden>
        <div><dt>姓名</dt><dd id="verifiedName"></dd></div>
        <div><dt>学号/工号</dt><dd id="verifiedIdentifier"></dd></div>
        <div><dt>签到时间</dt><dd id="verifiedTime"></dd></div>
        <div><dt>考勤状态</dt><dd id="verifiedAttendance"></dd></div>
        <div><dt>班次 / 岗位</dt><dd id="verifiedAssignment"></dd></div>
      </dl>
    </div>
  </div>
</div>
